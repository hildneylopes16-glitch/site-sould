<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOULD | Login Backend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #121212; 
            color: white; 
            font-family: 'Arial Black', sans-serif; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background-color: #000000;
            border: 2px solid #222;
            box-shadow: 0px 0px 20px rgba(255, 0, 0, 0.15);
            transition: 0.3s;
        }

        .login-container:hover {
            border-color: #ff0000;
            box-shadow: 0px 0px 25px rgba(255, 0, 0, 0.3);
        }

        .brand-title {
            color: #ff0000;
            letter-spacing: 3px;
            font-weight: bold;
            text-shadow: 0px 0px 10px rgba(255, 0, 0, 0.4);
        }

        .form-control {
            background-color: #1a1a1a !important;
            border: 1px solid #333 !important;
            color: white !important;
            font-family: sans-serif;
            border-radius: 0;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #ff0000 !important;
            box-shadow: none !important;
        }

        .form-label {
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #aaa;
        }

        .btn-login {
            background-color: #ff0000;
            color: white;
            font-weight: bold;
            border-radius: 0;
            border: none;
            padding: 12px;
            width: 100%;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            background-color: #ffffff;
            color: #ff0000;
        }

        .alert-danger {
            background-color: #2a0000;
            border: 1px solid #ff0000;
            color: #ff8888;
            border-radius: 0;
            font-family: sans-serif;
            font-size: 0.9rem;
        }

        .back-link {
            color: #666;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #ff0000;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center px-3">
        <div class="login-container text-center">
            
            <h2 class="brand-title mb-2">SOULD</h2>
            <p class="text-secondary small mb-4" style="font-family: sans-serif; letter-spacing: 1px;">PAINEL ADMINISTRATIVO</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} text-start mb-3 animate__animated animate__fadeIn" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3 text-start">
                    <label for="usuario" class="form-label">USUÁRIO</label>
                    <div class="input-group">
                        <span class="input-group-text bg-black text-secondary border-secondary rounded-0" style="border-right: none !important;"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="usuario" name="usuario" required placeholder="Digite o usuário">
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label for="senha" class="form-label">SENHA</label>
                    <div class="input-group">
                        <span class="input-group-text bg-black text-secondary border-secondary rounded-0" style="border-right: none !important;"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="senha" name="senha" required placeholder="Digite a senha">
                    </div>
                </div>

                <button type="submit" class="btn btn-login mb-3">ENTRAR NO PAINEL</button>
            </form>

            <div class="mt-3">
                <a href="{{ url_for('index') }}" class="back-link">
                    <i class="fas fa-arrow-left me-1"></i> Voltar para o Site
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
