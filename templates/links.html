<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOULD | Links Oficiais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #0d0d0d;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .linktree-container {
            width: 100%;
            max-width: 450px;
            text-center: center;
        }
        .profile-img {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: 2px solid #ff0000;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .band-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 5px;
        }
        .band-subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 30px;
        }
        .btn-linktree {
            background: #161616;
            color: white;
            border: 1px solid #333;
            border-radius: 0;
            padding: 16px;
            margin-bottom: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            display: block;
            text-decoration: none;
        }
        .btn-linktree:hover {
            background: #ff0000;
            color: black;
            border-color: #ff0000;
            font-weight: bold;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="linktree-container text-center">
        <img src="{{ url_for('static', filename='img/logo.png') }}" onerror="this.src='https://placehold.co/100x100/161616/ff0000?text=SOULD'" class="profile-img" alt="SOULD">
        
        <h1 class="band-title">SOULD</h1>
        <p class="band-subtitle">Acompanhe nossos lançamentos e redes oficiais</p>

        <div class="mt-4">
            {% for link in links %}
                <a href="{{ link.url }}" target="_blank" class="btn-linktree">
                    {{ link.titulo }}
                </a>
            {% else %}
                <p class="text-secondary small italic py-4">Nenhum link disponível no momento.</p>
            {% endfor %}
            
            <a href="{{ url_for('index') }}" class="btn btn-sm btn-outline-secondary rounded-0 mt-4 w-100 py-2 small">
                <i class="fas fa-globe me-2"></i>Acessar Site Oficial
            </a>
        </div>
    </div>

</body>
</html>
