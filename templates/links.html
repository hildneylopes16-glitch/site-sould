<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOULD | Links Oficiais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0b0b0b;
            color: white;
            font-family: 'Arial Black', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }
        .links-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .band-logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0px 0px 10px rgba(255, 0, 0, 0.6));
        }
        .band-sub {
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: #aaa;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        
        /* ESTILIZAÇÃO DOS BOTÕES ESTILO LINKTREE HARDCORE */
        .btn-linktree {
            background-color: #121212;
            color: white;
            border: 2px solid #222;
            border-radius: 0px;
            padding: 16px 20px;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            transition: all 0.3s ease-in-out;
            text-decoration: none;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
        .btn-linktree i {
            font-size: 1.3rem;
            width: 30px;
            text-align: center;
        }
        .btn-linktree .btn-icon-right {
            font-size: 0.85rem;
            opacity: 0.3;
            transition: 0.3s;
        }
        
        /* HOVERS E CORES DOS ÍCONES */
        .btn-linktree:hover {
            background-color: #ff0000;
            color: white;
            border-color: #ff0000;
            transform: translateY(-3px);
            box-shadow: 0px 0px 15px rgba(255, 0, 0, 0.5);
        }
        .btn-linktree:hover .btn-icon-right {
            opacity: 1;
            transform: translateX(3px);
        }

        .btn-instagram:hover { 
            background-color: #E1306C; 
            border-color: #E1306C; 
            box-shadow: 0px 0px 15px rgba(225, 48, 108, 0.5); 
        }

        .footer-credits {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="links-container">
        <img src="{{ url_for('static', filename='img/logo_sould_transparente.png') }}" alt="SOULD" class="band-logo">
        <div class="band-sub">Hardcore & Pop Rock</div>

        <a href="https://wa.me/5512982147326?text=Olá!%20Gostaria%20de%20obter%20mais%20informações%20sobre%20orçamento%20de%20shows%20da%20Banda%20SOULD." target="_blank" class="btn-linktree">
            <i class="fab fa-whatsapp text-success"></i>
            <span>Contratar Show</span>
            <i class="fas fa-chevron-right btn-icon-right"></i>
        </a>

        <a href="{{ url_for('index') }}#agenda" class="btn-linktree">
            <i class="fas fa-calendar-alt text-danger"></i>
            <span>Próximos Shows</span>
            <i class="fas fa-chevron-right btn-icon-right"></i>
        </a>

        <a href="{{ url_for('index') }}#loja" class="btn-linktree">
            <i class="fas fa-shopping-cart text-warning"></i>
            <span>Camisetas e Bonés</span>
            <i class="fas fa-chevron-right btn-icon-right"></i>
        </a>

        <a href="{{ url_for('galeria') }}" class="btn-linktree">
            <i class="fas fa-images text-info"></i>
            <span>Galeria de Fotos</span>
            <i class="fas fa-chevron-right btn-icon-right"></i>
        </a>

        <a href="https://www.instagram.com/bandasould" target="_blank" class="btn-linktree btn-instagram">
            <i class="fab fa-instagram" style="color: #E1306C;"></i>
            <span>Instagram Oficial</span>
            <i class="fas fa-chevron-right btn-icon-right"></i>
        </a>

        <div class="footer-credits">
            © 2026 SOULD • SÃO JOSÉ DOS CAMPOS/SP
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
