<section id="agenda" class="container text-center my-5">
    <h2 class="mb-5" style="color: #fff; letter-spacing: 3px;">PRÓXIMOS SHOWS</h2>
    <div class="agenda-container-flex d-flex flex-wrap justify-content-center align-items-start gap-4">
        
        <div class="agenda-wrapper" style="flex: 1; min-width: 300px; max-width: 600px;">
            <div class="list-group">
                {% for show in shows %}
                <div class="list-group-item bg-dark text-white d-flex justify-content-between align-items-center p-4 border-secondary">
                    <div class="text-start">
                        <strong style="font-size: 1.1rem; color: #ff0000;">{{ show.data }}</strong><br>
                        
                        {% if show.endereco %}
                        <a href="https://www.google.com/maps/dir/?api=1&destination={{ show.endereco|urlencode }}" 
                           target="_blank" 
                           style="text-decoration: none; color: #fff; font-weight: bold; font-size: 1.2rem;">
                            <i class="fas fa-directions me-2 text-danger"></i>{{ show.local|upper }}
                        </a>
                        <br><small class="text-secondary">Clique para abrir o GPS</small>
                        {% else %}
                        <span style="font-weight: bold; font-size: 1.2rem;">{{ show.local|upper }}</span>
                        {% endif %}
                    </div>
                    <span class="badge bg-danger p-2">{{ show.cidade|upper }}</span>
                </div>
                {% endfor %}
            </div>

            <div class="mt-4">
                <a href="https://wa.me/5512974106100?text=Olá,%20gostaria%20de%20informações%20sobre%20os%20shows%20da%20Sould!" 
                   target="_blank" 
                   class="btn btn-success btn-lg rounded-0 w-100" 
                   style="background-color: #25d366; border: none; font-weight: bold;">
                    <i class="fab fa-whatsapp me-2"></i>CONTATO PARA SHOWS (MÁRCIO)
                </a>
            </div>
        </div>

        <div class="souldinho-box">
            <img src="{{ url_for('static', filename='img/souldinho.png') }}" class="souldinho-img" style="max-width: 250px;">
        </div>
        
    </div>
</section>
