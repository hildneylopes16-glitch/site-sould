<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOULD | Hardcore & Pop Rock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #121212; color: white; font-family: 'Arial Black', sans-serif; overflow-x: hidden; }
        
        /* AJUSTE NAVBAR MOBILE */
        .navbar { border-bottom: 1px solid #222; }
        .navbar-toggler { border: none; color: #ff0000; font-size: 1.5rem; }
        .navbar-toggler:focus { shadow: none; outline: none; box-shadow: none; }
        
        @media (max-width: 991px) {
            .navbar-collapse { background-color: #000; padding: 20px; text-align: center; }
            .nav-link { font-size: 1.2rem; margin: 10px 0; border-bottom: 1px solid #111; }
        }

        /* HERO SECTION - AJUSTE DEFINITIVO DE RESOLUÇÃO */
        .hero-section { 
            height: 100vh; 
            display: flex; align-items: center; justify-content: center; text-align: center; 
            position: relative; overflow: hidden;
            background-color: #000; /* Fundo preto caso a imagem seja menor */
        }
        .hero-slider { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .slide {
            position: absolute; width: 100%; height: 100%;
            /* AJUSTE: 'contain' garante que a foto apareça inteira sem cortes */
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center center;
            opacity: 0; animation: sliderAnim 15s infinite;
        }

        /* Ajuste para telas grandes: se a foto ficar com bordas laterais, 'cover' é melhor, 
           mas vamos centralizar o foco no topo para não cortar as cabeças */
        @media (min-width: 1200px) {
            .slide { 
                background-size: cover; 
                background-position: center 20%; /* Foca na parte de cima da foto */
            }
        }

        .slide:nth-child(1) { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('/static/img/show1.jpg'); animation-delay: 0s; }
        .slide:nth-child(2) { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('/static/img/show2.jpg'); animation-delay: 5s; }
        .slide:nth-child(3) { background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('/static/img/show3.jpg'); animation-delay: 10s; }
        
        @keyframes sliderAnim {
            0% { opacity: 0; }
            10% { opacity: 1; }
            33% { opacity: 1; }
            43% { opacity: 0; } 
            100% { opacity: 0; }
        }
        .hero-content { position: relative; z-index: 2; width: 90%; }
        .hero-content img { width: 100%; max-width: 500px; height: auto; filter: drop-shadow(0px 0px 15px rgba(255, 0, 0, 0.5)); }

        /* AGENDA & SOULDINHO */
        #agenda { padding: 80px 0; }
        .agenda-container-flex {
            display: flex; align-items: center; justify-content: center;
            max-width: 1200px; margin: 0 auto; gap: 30px;
        }
        .agenda-wrapper {
            flex: 1; max-height: 500px; overflow-y: auto; max-width: 800px; z-index: 2; padding-right: 10px;
        }
        .agenda-wrapper::-webkit-scrollbar { width: 6px; }
        .agenda-wrapper::-webkit-scrollbar-thumb { background: #ff0000; border-radius: 10px; }

        .list-group-item { 
            background-color: #1a1a1a !important; border: 1px solid #333 !important; 
            margin-bottom: 10px; transition: 0.3s;
        }
        .list-group-item:hover { border-color: #ff0000 !important; }
        .link-maps { color: #ff0000; text-decoration: none; font-weight: bold; }
        .link-maps:hover { text-decoration: underline; }

        .souldinho-box { width: 280px; z-index: 1; }
        .souldinho-img { width: 100%; filter: drop-shadow(0px 0px 20px rgba(255, 0, 0, 0.5)); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* BIO SECTION */
        #bio { background-color: #000; padding: 80px 0; }
        .bio-text { font-family: sans-serif; color: #ddd; line-height: 1.6; text-align: justify; }
        .bio-title { color: #ff0000; font-weight: bold; margin-top: 30px; }

        /* INTEGRANTES */
        .integrante-img-container { 
            overflow: hidden; border: 2px solid #333; background-color: #1a1a1a;
            width: 100%; height: 250px;
        }
        .integrante-card img { 
            width: 100%; height: 100%; object-fit: contain; 
            filter: grayscale(100%); transition: 0.4s; 
        }
        .integrante-card:hover img { filter: grayscale(0%); transform: scale(1.05); }

        /* SEÇÃO FOTÓGRAFO */
        #fotografo { background-color: #080808; padding: 80px 0; border-top: 1px solid #222; }
        .foto-sidney { width: 100%; border: 2px solid #333; transition: 0.4s; filter: grayscale(100%); object-fit: cover; height: 300px; }
        .foto-sidney:hover { border-color: #ff0000; filter: grayscale(0%); transform: scale(1.02); }
        .btn-sidney { background: #ff0000; color: white; font-weight: bold; border-radius: 0; border: none; padding: 12px 25px; text-decoration: none; display: inline-block; transition: 0.3s; width: 100%; max-width: 350px; }
        .btn-sidney:hover { background: #fff; color: #ff0000; }
        .insta-sidney { color: #fff; text-decoration: none; font-size: 1.1rem; transition: 0.3s; font-family: sans-serif; }
        .insta-sidney:hover { color: #ff0000; }

        /* LOJA */
        .shop-card { background: #1a1a1a; border: 1px solid #333; padding: 20px; transition: 0.3s; height: 100%; display: flex; flex-direction: column; }
        .shop-card:hover { border-color: #ff0000; }
        .shop-img-container { width: 100%; aspect-ratio: 1/1; overflow: hidden; margin-bottom: 15px; background: #121212; }
        .shop-img { width: 100%; height: 100%; object-fit: contain; }
        .shop-desc { font-size: 0.85rem; color: #bbb; font-family: sans-serif; margin-bottom: 15px; text-align: left; }
        .btn-buy { background: #ff0000; color: white; border-radius: 0; width: 100%; font-weight: bold; margin-top: auto; text-decoration: none; text-align: center; display: block; padding: 10px; }
        .btn-buy:hover { background: #cc0000; color: white; }

        /* DNA SECTION */
        .dna-section img { width: 100%; max-width: 600px; height: auto; border: 1px solid #333; margin-top: 20px; box-shadow: 0px 0px 20px rgba(255, 0, 0, 0.2); }

        footer { border-top: 2px solid #333; padding: 60px 0; background: #000; }

        @media (max-width: 991px) {
            .agenda-container-flex { flex-direction: column; }
            .souldinho-box { width: 200px; order: -1; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top bg-black">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#" style="color: #ff0000; letter-spacing: 2px;">SOULD</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuSould" aria-controls="menuSould" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>

            <div class="collapse navbar-collapse" id="menuSould">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link px-3" href="#agenda">SHOWS</a>
                    <a class="nav-link px-3" href="#bio">A BANDA</a>
                    <a class="nav-link px-3" href="#banda">INTEGRANTES</a>
                    <a class="nav-link px-3" href="#fotografo">FOTÓGRAFO</a>
                    <a class="nav-link px-3" href="#loja">LOJA</a>
                    <a class="nav-link px-3" href="/galeria" target="_blank">GALERIA</a>
                    <a class="nav-link px-3" href="#dna">DNA</a>
                    <a class="nav-link px-3" href="#contato">CONTATO</a>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero-section">
        <div class="hero-slider">
            <div class="slide"></div><div class="slide"></div><div class="slide"></div>
        </div>
        <div class="hero-content">
            <img src="{{ url_for('static', filename='img/logo_sould_transparente.png') }}" alt="Logo SOULD">
            <p class="lead mt-3" style="letter-spacing: 5px;">HARDCORE / POP ROCK</p>
        </div>
    </header>

    <section id="agenda" class="container text-center">
        <h2 class="mb-5">PRÓXIMOS SHOWS</h2>
        <div class="agenda-container-flex">
            <div class="agenda-wrapper">
                <div class="list-group">
                    {% for show in shows %}
                    <div class="list-group-item text-white d-flex justify-content-between align-items-center p-4">
                        <div class="text-start">
                            <strong style="font-size: 1.1rem;">{{ show.data }}</strong><br>
                            {% if show.link_maps %}
                                <a href="{{ show.link_maps }}" target="_blank" class="link-maps">{{ show.local }}</a>
                            {% else %}
                                <small class="text-secondary">{{ show.local }}</small>
                            {% endif %}
                        </div>
                        <span class="badge bg-danger">{{ show.cidade|upper }}</span>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="souldinho-box">
                <img src="{{ url_for('static', filename='img/souldinho.png') }}" class="souldinho-img">
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.querySelectorAll('.navbar-nav .nav-link').forEach(link => {
            link.addEventListener('click', () => {
                const navbarCollapse = document.getElementById('menuSould');
                const bsCollapse = new bootstrap.Collapse(navbarCollapse, { toggle: false });
                if (navbarCollapse.classList.contains('show')) {
                    bsCollapse.hide();
                }
            });
        });
    </script>

</body>
</html>
