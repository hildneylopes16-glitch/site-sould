<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria | SOULD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #000; color: white; font-family: 'Arial Black', sans-serif; overflow-x: hidden; }
        
        /* HEADER DA GALERIA */
        .gallery-header {
            padding: 40px 0;
            border-bottom: 2px solid #ff0000;
            background: linear-gradient(rgba(255,0,0,0.1), rgba(0,0,0,1));
            text-align: center;
        }
        .btn-back {
            background-color: transparent;
            color: #ff0000;
            border: 1px solid #ff0000;
            font-weight: bold;
            padding: 8px 20px;
            text-decoration: none;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .btn-back:hover { background-color: #ff0000; color: white; }

        /* GRADE DE FOTOS AJUSTADA */
        .gallery-container { padding: 50px 0; }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border: 1px solid #222;
            height: 300px; /* Altura fixa para manter a linha organizada */
            cursor: pointer;
            background-color: #080808; /* Fundo levemente mais claro que o body para destaque */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* GARANTE QUE A FOTO NÃO SEJA CORTADA */
            filter: grayscale(100%);
            transition: 0.5s ease-in-out;
        }
        .gallery-item:hover img {
            filter: grayscale(0%);
            transform: scale(1.02); /* Zoom menor para não sair da borda */
        }
        .gallery-item::after {
            content: "\f00e"; 
            font-family: "Font Awesome 5 Free";
            font-weight: 900;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: #ff0000;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }
        .gallery-item:hover::after { opacity: 0.8; }

        /* LIGHTBOX (IMAGEM EXPANDIDA) */
        #lightboxModal .modal-content { background: rgba(0,0,0,0.95); border: none; }
        #lightboxModal .modal-body { display: flex; justify-content: center; align-items: center; padding: 10px; }
        #lightboxImage { max-width: 100%; max-height: 85vh; border: 1px solid #ff0000; object-fit: contain; }
        .btn-close-white { filter: invert(1) grayscale(100%) brightness(200%); }

        footer { border-top: 1px solid #333; padding: 40px 0; background: #000; font-size: 0.7rem; color: #555; text-align: center; }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .gallery-item { height: 200px; }
        }
    </style>
</head>
<body>

    <header class="gallery-header">
        <div class="container">
            <h1 style="letter-spacing: 5px; margin-bottom: 20px;">GALERIA SOULD</h1>
            <a href="/" class="btn-back"><i class="fas fa-arrow-left me-2"></i> Voltar ao Site Principal</a>
        </div>
    </header>

    <main class="gallery-container container">
        <div class="row g-3">
            {% for foto in fotos %}
            <div class="col-6 col-md-4 col-lg-3">
                <div class="gallery-item" onclick="openLightbox('{{ url_for('static', filename='img/galeria/' + foto) }}')">
                    <img src="{{ url_for('static', filename='img/galeria/' + foto) }}" alt="Show Sould">
                </div>
            </div>
            {% else %}
            <div class="col-12 text-center py-5">
                <p class="text-secondary">Nenhuma foto encontrada na pasta static/img/galeria/</p>
            </div>
            {% endfor %}
        </div>
    </main>

    <div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img src="" id="lightboxImage" alt="Zoom Sould">
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 SOULD | SÃO JOSÉ DOS CAMPOS | TODOS OS DIREITOS RESERVADOS
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function openLightbox(src) {
            const modal = new bootstrap.Modal(document.getElementById('lightboxModal'));
            document.getElementById('lightboxImage').src = src;
            modal.show();
        }
    </script>
</body>
</html>
